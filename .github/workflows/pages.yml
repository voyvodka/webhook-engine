name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "CNAME"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/pages.yml"
  # A release tag runs on refs/tags/*, which the github-pages environment does
  # not allow to deploy; workflow_run executes on the default branch instead.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage static site
        run: |
          version=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$version" ]; then
            echo "::error::No v<major>.<minor>.<patch> tag found"
            exit 1
          fi
          echo "Landing page version: $version"
          mkdir -p _site
          cp index.html CNAME robots.txt sitemap.xml _site/
          sed -i "s/{{version}}/${version#v}/g" _site/index.html
          if grep -q '{{version}}' _site/index.html; then
            echo "::error::{{version}} placeholder left in index.html"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
